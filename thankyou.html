  <style>
    body {
      background: #000;
      color: #FFD700;
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      margin: 0;
    }

    .checkmark {
      font-size: 120px;
      color: #FFD700;
      margin-bottom: 20px;
      animation: pop 0.6s ease forwards;
    }

    @keyframes pop {
      0% { transform: scale(0.2); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #FFD700;
      margin-bottom: 25px;
    }

    .btn {
      background: linear-gradient(90deg, #FFD700, #e6c100);
      color: #000;
      padding: 0.8rem 1.6rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #e6c100;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 215, 0, 0.3);
    }

    .glass-bg {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 215, 0, 0.15);
      border-radius: 16px;
      padding: 3rem 4rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 30px rgba(255, 215, 0, 0.1);
    }
  </style>
</head>

<body>
  <div class="glass-bg">
    <div class="checkmark">✔</div>
